services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php bin/console worker:run
    depends_on:
      - db

  nginx:
    image: nginx:latest
    restart: unless-stopped
    privileged: true
    networks:
      - default
      - proxy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

networks:
  proxy:
    external: true